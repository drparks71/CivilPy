# DEFINE STAGES EXPLICITLY TO CONTROL ORDER
stages:
  - sanity    # The blocker stage
  - test      # The matrix stage
  - security  # SBOM/SCA/SAST evidence jobs (scheduled + master; skipped on tags)
  - deploy    # The release stage

# Security/evidence jobs — vendored from the (private) Dane/compliance-evidence
# repo's ci/security.gitlab-ci.yml; vendored rather than include:project so fork
# MR pipelines still compile. Scan output publishes to the private evidence repo,
# never to this repository.
include:
  - local: .gitlab/security.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip_cache"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv_cache"

# Superseded pipelines release their runners instead of finishing doomed jobs
default:
  interruptible: true

# Global Cache — uv's wheel cache works across Python versions, so one
# per-branch cache serves the whole matrix (a cached venv/ never did:
# site-packages is version-specific, so every job rebuilt it anyway)
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .uv_cache/

# --- TEMPLATES (Do not run, just hold the scripts) ---
.install_deps:
  script:
    - pip install uv
    - uv venv --clear venv   # --clear: stale venv/ can arrive via the pre-uv branch cache
    - source venv/bin/activate
    - uv pip install setuptools -e ".[db,geo,web,jupyter,validation]" pytest pytest-cov pytest-xdist

# matrix jobs: no coverage — the smoke job already measures it, and the
# tracer is the expensive part of the suite
.test_logic:
  script:
    - !reference [.install_deps, script]
    - python -m pytest -n auto

# smoke job: coverage for the GitLab widget + MR annotations
.test_logic_cov:
  script:
    - !reference [.install_deps, script]
    - python -m pytest -n auto --cov --cov-report term --cov-report xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# --- STAGE 1: SANITY CHECK (The Blocker) ---
# If this fails, the pipeline STOPS here.
# Skip with: git tag docs && git push --tags
#        or: -no_tests in commit title
smoke-test-3.11:
  extends: .test_logic_cov
  stage: sanity
  image: python:3.11
  rules:
    - if: $CI_COMMIT_TAG                           # never run on any tag push
      when: never
    - if: $CI_COMMIT_TITLE =~ /-no_tests/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# uv.lock must match pyproject.toml, and requirements.txt must be the export of
# uv.lock (grype scans both, so a hand-edited or stale pin shows up as findings).
# Fix a red job with:
#   uv lock && uv export --frozen --no-emit-project --no-hashes --extra full --extra test -o requirements.txt
deps-sync:
  stage: sanity
  image: python:3.11
  cache: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install -q uv
    - uv lock --check
    - uv export --frozen --no-emit-project --no-hashes --extra full --extra test -q -o /tmp/requirements.txt
    # compare pins only — the autogenerated header varies across uv versions
    - diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

# --- STAGE 2: COMPATIBILITY MATRIX ---
# These run only if smoke-test-3.11 passed.
verify-3.10:
  extends: .test_logic
  stage: test
  image: python:3.10
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /-no_tests/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-3.12:
  extends: .test_logic
  stage: test
  image: python:3.12
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /-no_tests/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-3.13:
  extends: .test_logic
  stage: test
  image: python:3.13
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /-no_tests/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-3.14:
  extends: .test_logic
  stage: test
  image: python:3.14
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /-no_tests/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- STAGE 3: DEPLOY ---
# Triggered by git tags:
#   git tag docs && git push --tags          → deploys pages only
#   git tag v0.1.41 && git push --tags       → releases to PyPI + GitLab package registry
#   git push (no tag)                        → pages deploys on master commits

pypi_publish:
  stage: deploy
  image: python:3.11
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/     # tags like v0.1.41, v1.0.0
  script:
    - pip install -U build twine setuptools
    - python -m build
    - twine upload --verbose dist/*

gitlab_publish:
  stage: deploy
  image: python:3.11
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/     # tags like v0.1.41, v1.0.0
  script:
    - pip install build twine setuptools
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --verbose --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*

pages:
  stage: deploy
  image: python:3.11
  script:
    - pip install uv
    - uv pip install --system -r docs/requirements.txt .
    - python -m sphinx docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG == "docs"                 # git tag docs && git push --tags
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/     # also deploy on version tags
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # and on every master commit
