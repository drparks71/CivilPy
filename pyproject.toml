[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civilpy"
version = "0.4.5"
description = "Civil Engineering Tools in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dane Parks", email = "Dane@daneparks.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "sympy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "scipy>=1.11",
    "Pint>=0.20",
    "requests>=2.28",
    "defusedxml>=0.7",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "termcolor>=1.1",
    "natsort>=8.2",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "typing_extensions>=4.0",
    "ezdxf>=1.1",
]

[project.optional-dependencies]
db = [
    "SQLAlchemy>=2.0",
    "psycopg>=3.2",
    "psycopg-binary>=3.2",
    "oracledb>=2.0",
    "sshtunnel>=0.4",
]
pdf = [
    "PyMuPDF>=1.23",
    "camelot-py>=0.11",
    "pytesseract>=0.3",
    "pikepdf>=9",
]
geo = [
    "folium>=0.14",
    "tifftools>=1.3",
    "pyproj>=3.6",  # civilpy.state.ohio.coordinates
]
lidar = [
    # lazily imported by civilpy.transportation.terrain and civilpy.scan
    # (the scan-to-CAD core is numpy/scipy only; laspy reads .las/.laz,
    # open3d is used for Poisson / ball-pivot reconstruction)
    "laspy[lazrs]>=2.5",
    "pyproj>=3.6",
    "open3d>=0.18",
    "ipyleaflet>=0.18",
]
mcp = [
    # 2.0 moved mcp.server.fastmcp; build_server targets the 1.x API
    "mcp>=1.0,<2",
]
ai = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pytesseract>=0.3",
]
web = [
    "selenium>=3.141",
    "plotly>=5.0",
    "beautifulsoup4>=4.11",  # notebook walkthroughs only — no src/ imports
]
jupyter = [
    "nbformat>=5.7",
    "nbconvert>=7.0",
    "ipywidgets>=8.0",
    "ipykernel>=6.0",
]
validation = [
    "pydantic>=2.0",
    "pydantic_core>=2.0",
    "python-dotenv>=1.0",
]
cande = [
    "cande-wrapper>=0.1",
]
rhino = [
    "rhino3dm>=8.0",
]
fem = [
    "pygmsh>=7.1",
    "scikit-fem>=8.0",
    "scikit-image>=0.21",
    "networkx>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
full = [
    "civilpy[db,pdf,geo,web,jupyter,validation,rhino,fem]",
    "FreeSimpleGUI>=5.0",
]

[project.urls]
Homepage = "https://daneparks.com/Dane/civilpy"
Documentation = "https://dane.daneparks.com/civilpy"
Repository = "https://daneparks.com/Dane/civilpy"

[project.scripts]
civilpy = "civilpy.cli:civilpy_cli"
civilpy-pw-mcp = "civilpy.mcp.pw_server:main"
civilpy-box-bridges = "civilpy.structural.box_bridge_gallery:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "Notebooks*", "secrets*", "docs*", "res*"]

[tool.setuptools.package-data]
civilpy = ["structural/res/*.csv", "structural/odot/res/*.csv", "structural/spanwire/res/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/civilpy"]
branch = true
omit = [
    "tests",
    ".tox/*",
    "docs/*",
    "res*",
    "Training/*",
    "venv/*",
    "*/general/bentley/*",
    "*/general/database_tools.py",
    "*/general/photos.py",
    "*/general/jupyter.py",
]
parallel = true
